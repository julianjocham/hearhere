name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The asr/diarization/capture extras pull torch, NeMo and host audio
      # libraries — far too heavy for CI. Those engines are imported lazily and
      # their tests stub them out, so the pure-logic suite runs without them.
      # ([dev] does pull numpy/soundfile, so the WAV-writing tests still run.)
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[webui,dev]"

      - name: Run tests
        run: python -m pytest -q
