[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearhere"
version = "0.0.1"
description = "A fully local, dual-channel meeting transcriber (mic + system output) with speaker attribution and local-LLM summaries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julian Jocham" }]
keywords = ["transcription", "asr", "diarization", "meetings", "local", "parakeet"]

# NOTE: The core (CLI, config, validation, merge, export) needs only these; the
# heavy engines live behind optional-dependency groups and are imported lazily,
# so `import hearhere` and the pure-logic pipeline work without them installed.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
asr = [            # Batch 1: Parakeet ASR via NeMo
    "nemo_toolkit[asr]>=2.0",
    "torch>=2.2",
    "soundfile>=0.12",
]
capture = [        # Batch 1 (Windows) / 3 / 4: dual-channel audio capture
    "soundcard>=0.4.3",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.24",
]
diarization = [    # Batch 2: pyannote.audio speaker diarization
    "pyannote.audio>=3.1",
    "torch>=2.2",
]
llm = [            # Batch 2: local summarization via Ollama
    "ollama>=0.3",
]
remote = [         # Batch 5: remote worker (server) + client
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
webui = [          # Batch 7: local web UI (browse/review/re-export in the browser)
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    # numpy/soundfile are the light half of [capture] (no torch, no host audio
    # libs) and several capture tests importorskip on them — without these the
    # stop()/WAV-writing regression guards silently skip in CI.
    "numpy>=1.24",
    "soundfile>=0.12",
    "pytest>=8.0",
]

[project.scripts]
hearhere = "hearhere.cli:app"

[project.urls]
Homepage = "https://github.com/julianjocham/hearhere"

[tool.setuptools.packages.find]
include = ["hearhere*"]

[tool.setuptools.package-data]
# Ship the web UI's single-page frontend inside the wheel.
"hearhere.webui" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
